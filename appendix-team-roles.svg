<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentstyletype="text/css" data-diagram-type="ACTIVITY" height="728px" preserveAspectRatio="none" style="width:885px;height:728px;background:#FEFEFE;" version="1.1" viewBox="0 0 885 728" width="885px" zoomAndPan="magnify"><title>附录：团队配置与人因评估流程</title><defs></defs><g><rect fill="#FEFEFE" height="728" style="stroke:none;stroke-width:1;" width="885" x="0" y="0"></rect><g class="title" data-source-line="8"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="202.125" x="340.1836" y="36.0439">附录：团队配置与人因评估流程</text></g><ellipse cx="383.8628" cy="60.1201" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"></ellipse><path d="M491.8628,80.1201 L491.8628,134.3833 L471.8628,138.3833 L491.8628,142.3833 L491.8628,196.6465 A0,0 0 0 0 491.8628,196.6465 L698.4746,196.6465 A0,0 0 0 0 698.4746,196.6465 L698.4746,90.1201 L688.4746,80.1201 L491.8628,80.1201 A0,0 0 0 0 491.8628,80.1201" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"></path><path d="M688.4746,80.1201 L688.4746,90.1201 L698.4746,90.1201 L688.4746,80.1201" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"></path><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="64.4668" x="497.8628" y="100.0181">5 维度评估</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.6118" x="497.8628" y="117.7725">· 团队规模（小型 / 中型 / 大型）</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.3418" x="497.8628" y="135.5269">· 协作成熟度（M1/M2/M3）</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.5444" x="497.8628" y="153.2813">· 关键人能力（L1/L2/L3）</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.7764" x="497.8628" y="171.0356">· 跨团队协作（是 / 否）</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.6118" x="497.8628" y="188.79">· 用例库积累（有 / 部分 / 无）</text><rect fill="#F1F1F1" height="36.3887" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="176" x="295.8628" y="120.189"></rect><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156" x="305.8628" y="143.9409">项目立项，启动团队配置评估</text><path d="M428.8628,206.6465 L428.8628,447.4536 L674.8428,447.4536 L674.8428,216.6465 L664.8428,206.6465 L428.8628,206.6465" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"></path><path d="M664.8428,206.6465 L664.8428,216.6465 L674.8428,216.6465 L664.8428,206.6465" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"></path><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="224.98" x="434.8628" y="226.5444">⚠️ 木桶效应：流程适配按"最弱一环"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="434.8628" y="244.2988">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.1436" x="434.8628" y="262.0532">团队平均 L1，但某人 L3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="13" x="449.3101" y="279.8076">↓</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.6836" x="434.8628" y="297.562">按 L3 适配流程</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="13" x="449.3101" y="315.3164">↓</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.6836" x="434.8628" y="333.0708">否则 L3 那个人的工作会卡住整个流程</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="434.8628" y="350.8252">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="26.8125" x="434.8628" y="368.5796">案例</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78" x="461.6753" y="368.5796">：拿货宝项目</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.0845" x="434.8628" y="386.334">· 团队大部分 L1，但蒋亮 L2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.8545" x="434.8628" y="404.0884">· 实际按团队整体 L1.5（折中）走</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.9536" x="434.8628" y="421.8428">· 保留短联调期 1-2 天</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.8545" x="434.8628" y="439.5972">· 结果：6/23 按节点交付</text><polygon fill="#F1F1F1" points="350.8628,447.4536,416.8628,447.4536,428.8628,459.4536,416.8628,471.4536,350.8628,471.4536,338.8628,459.4536,350.8628,447.4536" style="stroke:#181818;stroke-width:0.5;"></polygon><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="66" x="350.8628" y="464.5481">是否跨团队？</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="64.7754" x="274.0874" y="457.0366">是 - 大型项目</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="53.7754" x="428.8628" y="457.0366">否 - 中小型</text><rect fill="#F1F1F1" height="36.3887" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="287.0586" x="11" y="481.4536"></rect><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="267.0586" x="21" y="505.2056">采用大型配置（2 后端 + 1 前端 + 2 测试 + 1 PM）</text><rect fill="#F1F1F1" height="36.3887" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="139.3496" x="84.8545" y="552.8423"></rect><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.3496" x="94.8545" y="576.5942">需要阶段 1.5 测试方案</text><rect fill="#F1F1F1" height="36.3887" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="191.0176" x="59.0205" y="624.231"></rect><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.0176" x="69.0205" y="647.9829">需要 6 类测试（含性能 + 安全）</text><ellipse cx="154.5293" cy="706.6196" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"></ellipse><ellipse cx="154.5293" cy="706.6196" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"></ellipse><polygon fill="#F1F1F1" points="569.3413,481.4536,657.0513,481.4536,669.0513,493.4536,657.0513,505.4536,569.3413,505.4536,557.3413,493.4536,569.3413,481.4536" style="stroke:#181818;stroke-width:0.5;"></polygon><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="87.71" x="569.3413" y="498.5481">工作量 &gt; 5 人日？</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="64.7754" x="492.5659" y="491.0366">是 - 中型项目</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="64.7754" x="669.0513" y="491.0366">否 - 小型迭代</text><rect fill="#F1F1F1" height="36.3887" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="287.0586" x="328.0586" y="515.4536"></rect><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="267.0586" x="338.0586" y="539.2056">采用中型配置（1 后端 + 1 前端 + 1 测试 + 1 PM）</text><rect fill="#F1F1F1" height="36.3887" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="223.6836" x="359.7461" y="586.8423"></rect><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203.6836" x="369.7461" y="610.5942">4 类自动化测试（不强制性能 + 安全）</text><ellipse cx="471.5879" cy="669.231" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"></ellipse><ellipse cx="471.5879" cy="669.231" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"></ellipse><rect fill="#F1F1F1" height="36.3887" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239.375" x="635.1172" y="515.4536"></rect><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219.375" x="645.1172" y="539.2056">采用小型配置（1 全栈 + 1 测试 + 1 PM）</text><rect fill="#F1F1F1" height="36.3887" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="229.6895" x="639.96" y="586.8423"></rect><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="209.6895" x="649.96" y="610.5942">跳过测试方案，直接 AI 用例 + 4 类测试</text><ellipse cx="754.8047" cy="669.231" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"></ellipse><ellipse cx="754.8047" cy="669.231" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"></ellipse><line style="stroke:#181818;stroke-width:1;" x1="383.8628" x2="383.8628" y1="70.1201" y2="120.189"></line><polygon fill="#181818" points="379.8628,110.189,383.8628,120.189,387.8628,110.189,383.8628,114.189" style="stroke:#181818;stroke-width:1;"></polygon><line style="stroke:#181818;stroke-width:1;" x1="154.5293" x2="154.5293" y1="517.8423" y2="552.8423"></line><polygon fill="#181818" points="150.5293,542.8423,154.5293,552.8423,158.5293,542.8423,154.5293,546.8423" style="stroke:#181818;stroke-width:1;"></polygon><line style="stroke:#181818;stroke-width:1;" x1="154.5293" x2="154.5293" y1="589.231" y2="624.231"></line><polygon fill="#181818" points="150.5293,614.231,154.5293,624.231,158.5293,614.231,154.5293,618.231" style="stroke:#181818;stroke-width:1;"></polygon><line style="stroke:#181818;stroke-width:1;" x1="154.5293" x2="154.5293" y1="660.6196" y2="695.6196"></line><polygon fill="#181818" points="150.5293,685.6196,154.5293,6